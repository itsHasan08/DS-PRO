name: DS PRO Android CI & APK Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test DS PRO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Ensure Android 36.1 platform and licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMGR="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMGR" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          if [ ! -f "$SDK_ROOT/platforms/android-36.1/android.jar" ]; then
            "$SDKMGR" --sdk_root="$SDK_ROOT" "platforms;android-36.1" || \
            "$SDKMGR" --sdk_root="$SDK_ROOT" --channel=1 "platforms;android-36.1" || \
            "$SDKMGR" --sdk_root="$SDK_ROOT" --channel=3 "platforms;android-36.1" || true
          fi
          ls -la "$SDK_ROOT/platforms" "$SDK_ROOT/build-tools"

      - name: Restore or create debug keystore for APK signing
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -noprompt -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore debug.keystore -storepass android >/dev/null

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Verify Gradle version
        run: |
          which gradle
          gradle --version

      - name: Build Debug APK
        run: |
          set -o pipefail
          if ! gradle :app:assembleDebug --no-daemon --console=plain --stacktrace 2>&1 | tee build-debug.log; then
            {
              echo "### :app:assembleDebug Failure Log"
              echo '```text'
              tail -n 120 build-debug.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Run DS PRO Protection & Core Unit Tests
        run: |
          set -o pipefail
          if ! gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --no-daemon --console=plain --stacktrace 2>&1 | tee test-debug.log; then
            {
              echo "### Unit Test Failure Log"
              echo '```text'
              tail -n 120 test-debug.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify Release Compilation & Resources
        run: gradle :app:compileReleaseKotlin :app:processReleaseResources --no-daemon --console=plain --stacktrace

      - name: Build Signed Release APK (when release secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASS != '' && env.KEY_PASS != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          export STORE_PASSWORD="$STORE_PASS"
          export KEY_PASSWORD="$KEY_PASS"
          gradle :app:assembleRelease --no-daemon --console=plain --stacktrace

      - name: Upload DS PRO Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS-PRO-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload DS PRO Release APK Artifact
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: DS-PRO-Release-APK
          path: app/build/outputs/apk/release/*.apk

      - name: Publish Official GitHub Release (APK)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release_assets
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="v1.0.${{ github.run_number }}"
          fi

          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "release_assets/DS-PRO-${RELEASE_TAG}-release.apk"
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "release_assets/DS-PRO-${RELEASE_TAG}.apk"

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release_assets/*.apk --clobber
          else
            gh release create "$RELEASE_TAG" release_assets/*.apk \
              --title "DS PRO $RELEASE_TAG" \
              --notes "Official DS PRO Android APK release (build #${{ github.run_number }}). Includes AES-256-GCM DEX encryption, 360/StubApp packer compatibility, live anti-dump watchdog, and runtime guards." \
              --latest
          fi
