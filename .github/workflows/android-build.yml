name: DS PRO Android CI & APK Build

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    name: Build & Test DS PRO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Ensure Android 36.1 platform and licenses
        run: |
          SDKMGR="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMGR" ]; then
            SDKMGR="$(command -v sdkmanager)"
          fi
          set +o pipefail
          yes | "$SDKMGR" --licenses >/dev/null 2>&1 || true
          set -o pipefail
          "$SDKMGR" "platforms;android-36.1" || true
          "$SDKMGR" --list_installed

      - name: Restore debug keystore for APK signing
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.3.1"
          cache-provider: basic

      - name: Verify Gradle version
        run: |
          which gradle
          gradle --version

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Run DS PRO Protection & DPT Unit Tests
        run: gradle :app:testDebugUnitTest --tests com.example.ExampleUnitTest --no-daemon

      - name: Verify Release Compilation & Resources
        run: gradle :app:compileReleaseKotlin :app:processReleaseResources --no-daemon

      - name: Build Signed Release APK (when release secrets configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
        if: env.KEYSTORE_BASE64 != '' && env.STORE_PASS != '' && env.KEY_PASS != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
          export STORE_PASSWORD="$STORE_PASS"
          export KEY_PASSWORD="$KEY_PASS"
          gradle :app:assembleRelease --no-daemon

      - name: Upload DS PRO Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DS-PRO-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload DS PRO Release APK Artifact
        if: hashFiles('app/build/outputs/apk/release/*.apk') != ''
        uses: actions/upload-artifact@v4
        with:
          name: DS-PRO-Release-APK
          path: app/build/outputs/apk/release/*.apk
